<!DOCTYPE html>
<!--
Program Name : patient-form.html
Author : Nishit Pachchigar
Date Created : 02/19/2026
Date last edited : 02/27/2026
Version : 2.5
Description : This file creates a foundation for patient registration form.
This form asks for details such as patient's demographic data and history in order
to create a profile.
-->
    <head>
        <title>Homework 1</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>
            <div class="header">
                <img src="images.png">
                <h1 class="Main-page-name">BestCare Medical</h1>
                <p id="date">Today's Date : </p>
                <script>
                    const date = new Date();
                    document.getElementById("date").innerHTML += date.toDateString();
                </script>
            </div>
            <form class="form-container" action="thank-you.html">  <!-- form redirects to thank you page -->
                <h1>Patient Registration Form</h1>
                <!-- Personal Information section starting -->
                <h4>Personal Information</h4>
                <div class="form-row">
                    <label for="name">Full name : </label>
                    <div>
                    <input type="text" id="fname" name="fname" placeholder="First Name" required>
                    <input type="text" id="midname" name="midname" placeholder="Mid">
                    <input type="text" id="lname" name="lname" placeholder="Last Name" required>
                    </div>
                </div>
                <div class="form-row">
                    <label for="dob">Date of Birth : </label>
                    <input type="text" id="dob" name="dob" placeholder="MM/DD/YYYY" required>
                </div>
                <div class="form-row">
                    <label for="sex">Sex : </label>
                    <div>
                        <label><input type="radio" name="sex" value="Male" required> Male</label>
                        <label><input type="radio" name="sex" value="Female"> Female</label>
                        <label><input type="radio" name="sex" value="Unknown"> Unknown</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="ssn">Social Security : </label>
                    <input type="text" id="ssn" name="ssn" placeholder="xxx-xx-xxxx" required>
                </div>
                <div class="form-row">
                    <label for="language">Preffered Language : </label>
                    <input type="text" id="language" name="language" placeholder='English, Spanish, French'>
                </div>
                <!-- Personal Information section ending -->
                <!-- Address Information section starting -->
                <h4>Address</h4> 
                <div class="form-row">
                    <label for="add1">Address Line 1 : </label>
                    <input type="text" id="add1" name="add1" placeholder="Street address" required>
                </div>
                <div class="form-row">
                    <label for="add2">Address Line 2 : </label>
                    <input type="text" id="add2" name="add2" placeholder="apartment #">
                </div>
                <div class="form-row">
                    <label for="city">City : </label>
                    <div class="inline-row">
                        <input type="text" id="city" name="city" placeholder="City" required>
                        <label for="state" class="inline-label">State : </label>
                        <select id="state" name="state" required>
                            <option value="">Select State</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <label for="zipcode">Zipcode : </label>
                    <input type="text" id="zipcode" name="zipcode" placeholder="zipcode" required>
                </div>
                <div class="form-row">
                    <label for="country">Country : </label>
                    <input type="text" id="country" name="country" placeholder="Country" required>
                </div>
                <!-- Address Information section ending -->
                <!-- Contact Information section starting -->
                <h4>Contact Information</h4>
                <div class="form-row">
                    <label for="fname">Phone : </label>
                    <div>
                    <input type="text" id="phone" name="phone" placeholder="(123) 456-7890" required>
                    </div>
                </div>
                <div class="form-row">
                    <label for="email">Email : </label>
                    <div class="inline-row2">
                        <input type="text" name="email-address" placeholder="address" required>
                        @
                        <input type="text" name="domain" placeholder="domain" required>
                        .com
                    </div>
                </div>
                <div class="form-row">
                    <label for="emergency-contact">Emergency Contact : </label>
                         <input type="text" id="emergency-contact" name="emergency-contact" placeholder="(123) 456-7890" required>
                </div>
                <!-- Contact Information section ending -->
                <!-- Medical History Information section starting -->
                <h4>Medical History</h4>
                <div class="form-row">
                    <label for="inquiry">Inquiry : </label>
                    <input type="text" id="inquiry" name="inquiry" placeholder="Please explain your condition">
                </div>
                <div class="form-row">
                    <label for="vaccination">Vaccinated : </label>
                    <div>
                        <label><input type="radio" name="vaccinated" value="Yes" required> Yes</label>
                        <label><input type="radio" name="vaccinated" value="No"> No</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="insurance">Insurance : </label>
                    <div>
                        <label><input type="radio" name="insurance" value="Yes" required> Yes</label>
                        <label><input type="radio" name="insurance" value="No"> No</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="health">Health : </label>
                    <div class="slider">
                        <input type="range" id="health-scale" name="health-scale" min="0" max="10" 
                        value="5" step="1" oninput="document.getElementById('healthValue').textContent = this.value" required>
                        <span id="healthValue">5</span>
                    </div>
                </div>
                <!-- Medical History Information section ending -->
                <!-- Account Information section starting -->
                <h4>Account Information</h4> 
                <div class="form-row">
                    <label for="userId">User ID : </label>
                    <input type="text" id="userId" name="userId" placeholder="Username" required>
                </div>
                <div class="form-row">
                    <label for="add2">Password : </label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-row">
                    <label for="add2">Confirm Password : </label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-Enter Password" required>
                </div>
                <p class="checkbox">
                    <input type="checkbox" required>
                    * Agree to the terms and conditions. 
                </p>
                <!-- Account Information section ending -->
                <div class="form-buttons">
                    <button type="reset" class="reset-button">Reset</button>
                    <button type="submit" class="submit-button">Submit</button>
                </div>
            </form>
        </div>
        <hr>
        <footer class="footer">
            <p class="p-footer">
                7900 Rosevelt Bridrge Drive,<br>
                Houston, TX<br>
                77070.
            </p>
        </footer>
    </body>
</html>
