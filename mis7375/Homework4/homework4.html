    <head>

    <body>
        <div>
            <div class="header">
                <img src="images.png" class="logo">
                <h1 class="Main-page-name">BestCare Medical</h1>
                <p id="date">Today's Date :</p>
                <!-- updated time based evnet function -->
                <script>
                function updateClock(){
                    const now = new Date();
                    document.getElementById("date").innerHTML = "Current Date & Time: " + now.toLocaleString();
                }
                setInterval(updateClock, 1000);
                updateClock();
                </script>
            </div>
            <form class="form-container" action="thank-you.html" onsubmit="return validateForm()"> 
                <h1>Patient Registration Form</h1>
                <!-- Personal Information section starting -->
                <h4>Personal Information</h4>
                <div class="form-row">
                    <label for="name">Full name : </label>
                    <div>
                    <input type="text" id="fname" pattern="[A-Za-z'-]{1,30}" title="Enter 1-30 characters, letters, apostrophes, or dashes only" name="fname" oninput="validateFirstName()">
                        <span class="error" id="fname-error">
                        </span>
                    <input type="text" id="midname" pattern="[A-Za-z]{1}" title="Single letter only" name="midname">
                    <input type="text" id="lname" pattern="[A-Za-z'-]{1,30}" title="Enter 1-30 characters, letters, apostrophes, or dashes only" name="lname" oninput="validateLastName()">
                        <span class="error" id="lname-error">
                        </span>
                </div>
                </div>
                <div class="form-row">
                    <label for="dob">Date of Birth : </label>
                    <input type="date" id="dob" name="dob" min="1900-01-01" max="2026-12-31" required title="Select your birth date (not in future, not older than 120 years)">
                        <span class="error" id="dob-error">
                        </span>
                </div>
                <div class="form-row">
                    <label for="sex">Sex : </label>
                    <div>
                        <label><input type="radio" name="sex" value="Male" required> Male</label>
                        <label><input type="radio" name="sex" value="Female"> Female</label>
                        <label><input type="radio" name="sex" value="Unknown"> Unknown</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="ssn">Social Security : </label>
                    <input type="password" id="ssn" name="ssn" pattern="\d{3}-\d{2}-\d{4}" title="Enter SSN in format 123-45-6789" required oninput="formatSSN()">
                        <span class="error" id="ssn-error">
                        </span>
                </div>
                <div class="form-row">
                    <label for="language">Preffered Language : </label>
                    <input type="text" id="language" name="language" placeholder='English, Spanish, French'>
                </div>
                <!-- Personal Information section ending -->
                <!-- Address Information section starting -->
                <h4>Address</h4> 
                <div class="form-row">
                    <label for="add1">Address Line 1 : </label>
                    <input type="text" id="add1" name="add1" placeholder="Street address" required>
                </div>
                <div class="form-row">
                    <label for="add2">Address Line 2 : </label>
                    <input type="text" id="add2" name="add2" placeholder="apartment #">
                </div>
                <div class="form-row">
                    <label for="city">City : </label>
                    <div class="inline-row">
                        <input type="text" id="city" name="city" placeholder="City" required>
                        <label for="state" class="inline-label">State : </label>

                        <select id="state" name="state" required>
                            <option value="">Select State</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <label for="zipcode">Zipcode : </label>
                    <input type="text" id="zipcode" name="zipcode" pattern="\d{5}(-\d{4})?" title="5-digit zip or zip+4 format" required>
                </div>
                <div class="form-row">
                    <label for="country">Country : </label>
                    <input type="text" id="country" name="country" placeholder="Country" required>
                </div>
                <!-- Address Information section ending -->
                <!-- Contact Information section starting -->
                <h4>Contact Information</h4>
                <div class="form-row">
                    <label for="fname">Phone : </label>
                    <div>
                    <input type="text" id="phone" name="phone" pattern="\d{3}-\d{3}-\d{4}" placeholder="123-456-7890" title="Format: 123-456-7890" required oninput="validatePhone()">
                        <span class="error" id="phone-error">
                        </span>
                    </div>
                </div>
                <div class="form-row">
                    <label for="email">Email : </label>
                    <div class="inline-row2">
                        <input type="email" id="email" name="email" placeholder="example@email.com" title="Enter a valid email like name@domain.com" required oninput="validateEmail()">
                            <span class="error" id="email-error">
                            </span>
                    </div>
                </div>
                <div class="form-row">
                    <label for="emergency-contact">Emergency Contact : </label>
                    <input type="text" id="emergency-contact" name="emergency-contact" pattern="\d{3}-\d{3}-\d{4}" title="Format: 123-456-7890" required>     
                        <span class="error" id="emergency-contact-error">
                        </span>
                </div>
                <!-- Contact Information section ending -->
                <!-- Medical History Information section starting -->
                <h4>Medical History</h4>
                <div class="form-row">
                    <label>Diseases (check all that apply):</label>
                    <div>
                        <label><input type="checkbox" name="disease" value="Chickenpox"> Chickenpox</label>
                        <label><input type="checkbox" name="disease" value="Measles"> Measles</label>
                        <label><input type="checkbox" name="disease" value="Covid-19"> Covid-19</label>
                        <label><input type="checkbox" name="disease" value="Flu"> Flu</label>
                        <label><input type="checkbox" name="disease" value="Asthma"> Asthma</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="inquiry">Inquiry : </label>
                    <input type="text" id="inquiry" name="inquiry" placeholder="Please explain your condition">
                </div>
                <div class="form-row">
                    <label for="vaccination">Vaccinated : </label>
                    <div>
                        <label><input type="radio" name="vaccinated" value="Yes" required> Yes</label>
                        <label><input type="radio" name="vaccinated" value="No"> No</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="insurance">Insurance : </label>
                    <div>
                        <label><input type="radio" name="insurance" value="Yes" required> Yes</label>
                        <label><input type="radio" name="insurance" value="No"> No</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="health">Health : </label>
                    <div class="slider">
                        <input type="range" id="health-scale" name="health-scale" min="0" max="10" 
                        value="5" step="1" oninput="document.getElementById('healthValue').textContent = this.value" required>
                        <span id="healthValue">5</span>
                    </div>
                </div>
                <div class="form-row">
                    <label for="comments">Comments:</label>
                    <textarea id="comments" rows="4" cols="40" title="Optional comments (avoid quotes)">
                    </textarea>
                </div>
                <!-- Medical History Information section ending -->
                <!-- Account Information section starting -->
                <h4>Account Information</h4> 
                <div class="form-row">
                    <label for="userId">User ID : </label>
                    <input type="text" id="userId" name="userId" title="5-30 characters, must start with a letter, no spaces" required oninput="validateUserId()">
                        <span class="error" id="userid-error">
                        </span>
                </div>
                <div class="form-row">
                    <label for="add2">Password : </label>
                    <input type="password" id="password" name="password" placeholder="Password" required oninput="validatePassword()">
                        <span class="error" id="password-error">
                        </span>
                </div>
                <div class="form-row">
                    <label for="add2">Confirm Password : </label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-Enter Password" required oninput="validateConfirmPassword()">
                        <span class="error" id="confirm-error">
                        </span>
                </div>
                <p class="checkbox">
                    <input type="checkbox" required>
                    * Agree to the terms and conditions. 
                </p>
                <!-- Account Information section ending -->
                <div class="form-buttons">
                    <button type="reset" class="reset-button">Reset</button>
                    <button type="button" onclick="reviewForm()">Review</button> <!-- Added the review button -->
                    <!-- Validate button, after successful validation turns into submit button -->
                    <button type="button" onclick="validateForm()">Validate</button>
                    <button type="submit" id="submitButton" style="display:none;">Submit</button>
                </div>
            </form>
            <h4 id="iframe-h4">Health Information</h4>
            <iframe src="https://www.cdc.gov" width="100%" height="200" title="CDC Website"></iframe>
            <div id="reviewSection">
                <h3>Review Information</h3>
                <div id="reviewInformation"></div>
            </div>
        </div>
        <hr>
        <footer class="footer">
            <p class="p-footer">
                7900 Rosevelt Bridrge Drive,<br>
                Houston, TX<br>
                77070.
            </p>
        </footer>
